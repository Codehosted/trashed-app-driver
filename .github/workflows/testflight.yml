name: Upload Driver App to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_ios:
        description: Build and upload iOS to TestFlight
        type: boolean
        required: true
        default: true
      build_android:
        description: Build Android QA APK artifacts
        type: boolean
        required: true
        default: true
      marketing_version:
        description: App Store marketing version
        required: false
        default: "1.0.7"
      build_number:
        description: Optional explicit build number. Defaults to UTC timestamp.
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "App.tsx"
      - "src/**"
      - "services/**"
      - "package.json"
      - "package-lock.json"
      - "bun.lockb"
      - "capacitor.config.ts"
      - "scripts/ci-upload-testflight.sh"
      - "scripts/validate-ios-privacy.py"
      - "fastlane/Fastfile"
      - ".github/workflows/testflight.yml"

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-checkpoint:
    if: github.event_name == 'workflow_dispatch' && inputs.build_android
    uses: ./.github/workflows/android-checkpoint.yml
    permissions:
      contents: read
    secrets:
      SLACK_MOBILE_BUILD_BOT_TOKEN: ${{ secrets.SLACK_MOBILE_BUILD_BOT_TOKEN }}

  upload-testflight:
    if: github.event_name != 'workflow_dispatch' || inputs.build_ios
    name: Build and upload TestFlight build
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      build_number: ${{ steps.version.outputs.build_number }}
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
    env:
      MARKETING_VERSION: ${{ github.event.inputs.marketing_version || '1.0.7' }}
      BUILD_NUMBER: ${{ github.event.inputs.build_number }}
      TRASHED_WEB_URL: https://trashed.app
      DEVELOPMENT_TEAM_ID: 3BYF8CNWS2
      BUNDLE_ID: com.trashed.driver
      PROVISIONING_PROFILE_SPECIFIER: "*[expo] com.trashed.driver AppStore 2025-12-07T19:19:09.367Z"
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
      GOOGLE_IOS_CLIENT_ID: 250847337560-a6992nl3hfasf80qi0gf4m82m3udipm3.apps.googleusercontent.com
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.38

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort -V | tail -1)"
          if [[ -z "$XCODE_PATH" ]]; then
            echo "Xcode 26 is required but is not installed on this runner." >&2
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          XCODE_VERSION_OUTPUT="$(xcodebuild -version)"
          printf '%s\n' "$XCODE_VERSION_OUTPUT"
          grep -Eq '^Xcode 26([.]|$)' <<< "$XCODE_VERSION_OUTPUT"

      - name: Resolve exact build identity
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BUILD_NUMBER="${BUILD_NUMBER:-$(date -u +%Y%m%d%H%M)}"
          [[ "$BUILD_NUMBER" =~ ^[0-9]{1,18}$ ]] || exit 2
          [[ "$MARKETING_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 2
          printf 'BUILD_NUMBER=%s\n' "$BUILD_NUMBER" >> "$GITHUB_ENV"
          printf 'build_number=%s\nversion=%s\n' "$BUILD_NUMBER" "$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
      - name: Upload to TestFlight
        run: bash scripts/ci-upload-testflight.sh

  notify-ios:
    needs: upload-testflight
    if: always() && vars.SLACK_APP_UPDATES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Notify iOS channel and verify message
        run: node scripts/notify-build-slack.mjs
        env:
          SLACK_APP_UPDATES_ENABLED: ${{ vars.SLACK_APP_UPDATES_ENABLED }}
          SLACK_MOBILE_BUILD_BOT_TOKEN: ${{ secrets.SLACK_MOBILE_BUILD_BOT_TOKEN }}
          SLACK_MOBILE_APP_IOS_CHANNEL_ID: ${{ vars.SLACK_MOBILE_APP_IOS_CHANNEL_ID }}
          MOBILE_PLATFORM: ios
          MOBILE_BUILD_STATUS: ${{ needs.upload-testflight.result }}
          MOBILE_VERSION: ${{ needs.upload-testflight.outputs.version }}
          MOBILE_BUILD_NUMBER: ${{ needs.upload-testflight.outputs.build_number }}
          SLACK_RECEIPT_PATH: slack-ios-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slack-ios-receipt-${{ github.run_id }}
          path: slack-ios-receipt.json
          if-no-files-found: warn
          retention-days: 14
