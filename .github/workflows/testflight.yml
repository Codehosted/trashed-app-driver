name: Audit Driver App Review Resubmission

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: Existing version to inspect
        default: "1.0.2"
        required: false
      build_number:
        description: Existing processed build to inspect
        default: "202609110306"
        required: false

jobs:
  app-review:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/ios-app-review-submit-20260911'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Read current Apple review state without exposing credentials
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: node scripts/ci-app-review-audit.mjs
